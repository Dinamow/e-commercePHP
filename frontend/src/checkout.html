<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">ShopEasy</a>
    <ul class="navbar-nav" id="navbar-nav"></ul>
  </div>
</nav>

<main>
  <div class="container">
    <h2 style="margin-bottom:1.5rem;">Checkout</h2>
    <div id="alert-box"></div>

    <!-- Success Message (hidden until order placed) -->
    <div id="checkout-success" style="display:none;" class="card">
      <div class="card-body" style="text-align:center; padding:3rem;">
        <h2 style="color:var(--success); margin-bottom:1rem;">Order Placed!</h2>
        <p>Thank you for your order. Your order ID is <strong id="success-order-id"></strong>.</p>
        <div style="margin-top:1.5rem; display:flex; gap:1rem; justify-content:center;">
          <a href="/orders.html" class="btn btn-primary">View My Orders</a>
          <a href="/products.html" class="btn btn-outline">Continue Shopping</a>
        </div>
      </div>
    </div>

    <div class="checkout-grid">
      <!-- Shipping Form -->
      <div class="card">
        <div class="card-body">
          <h3 style="margin-bottom:1.5rem;">Shipping Information</h3>
          <form id="checkout-form">
            <div class="form-group">
              <label for="ship-name">Full Name</label>
              <input type="text" id="ship-name" placeholder="John Doe" required />
            </div>
            <div class="form-group">
              <label for="ship-address">Address</label>
              <input type="text" id="ship-address" placeholder="123 Main St" required />
            </div>
            <div class="form-group">
              <label for="ship-city">City</label>
              <input type="text" id="ship-city" placeholder="Cairo" required />
            </div>
            <div class="form-group">
              <label for="ship-phone">Phone</label>
              <input type="tel" id="ship-phone" placeholder="+20 100 000 0000" required />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Place Order</button>
          </form>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="order-summary-items"></div>
        <div class="summary-item summary-total">
          <span>Total</span>
          <span id="order-total">$0.00</span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>&copy; 2026 ShopEasy. All rights reserved.</p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
