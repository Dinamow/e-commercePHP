<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Products - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">ShopEasy</a>
    <ul class="navbar-nav" id="navbar-nav"></ul>
  </div>
</nav>

<main>
  <div class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar card">
        <div class="card-body">
          <p style="font-weight:600; margin-bottom:0.75rem; color:var(--text-muted); font-size:.8rem; text-transform:uppercase;">Admin Panel</p>
          <ul>
            <li><a href="/admin/dashboard.html">Dashboard</a></li>
            <li><a href="/admin/products.html" class="active">Products</a></li>
            <li><a href="/admin/users.html">Users</a></li>
            <li><a href="/admin/orders.html">Orders</a></li>
          </ul>
        </div>
      </aside>

      <div class="admin-content">
        <div class="section-header">
          <h2>Products</h2>
          <button id="add-product-btn" class="btn btn-primary btn-sm">+ Add Product</button>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-body">
                <tr><td colspan="6" class="loading">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Product Modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-title">Add Product</h2>
      <button class="modal-close" id="close-modal-btn">&times;</button>
    </div>
    <form id="product-form">
      <input type="hidden" id="product-id" />
      <div class="form-group">
        <label for="product-name">Name</label>
        <input type="text" id="product-name" required />
      </div>
      <div class="form-group">
        <label for="product-desc">Description</label>
        <textarea id="product-desc"></textarea>
      </div>
      <div class="form-group">
        <label for="product-price">Price ($)</label>
        <input type="number" id="product-price" step="0.01" min="0" required />
      </div>
      <div class="form-group">
        <label for="product-category">Category</label>
        <input type="text" id="product-category" required />
      </div>
      <div class="form-group">
        <label for="product-stock">Stock</label>
        <input type="number" id="product-stock" min="0" required />
      </div>
      <div class="form-group">
        <label for="product-image">Image URL</label>
        <input type="text" id="product-image" placeholder="https://..." />
      </div>
      <button type="submit" class="btn btn-primary btn-full">Save Product</button>
    </form>
  </div>
</div>

<footer>
  <div class="container">
    <p>&copy; 2026 ShopEasy. All rights reserved.</p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
