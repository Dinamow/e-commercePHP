<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">ShopEasy</a>
    <ul class="navbar-nav" id="navbar-nav"></ul>
  </div>
</nav>

<main>
  <div class="container">
    <div class="admin-layout">
      <aside class="admin-sidebar card">
        <div class="card-body">
          <p style="font-weight:600; margin-bottom:0.75rem; color:var(--text-muted); font-size:.8rem; text-transform:uppercase;">Admin Panel</p>
          <ul>
            <li><a href="/admin/dashboard.html" class="active">Dashboard</a></li>
            <li><a href="/admin/products.html">Products</a></li>
            <li><a href="/admin/users.html">Users</a></li>
            <li><a href="/admin/orders.html">Orders</a></li>
          </ul>
        </div>
      </aside>

      <div class="admin-content">
        <h2 style="margin-bottom:1.5rem;">Dashboard</h2>
        <div class="stats-grid" id="stats-grid">
          <p class="loading">Loading stats...</p>
        </div>

        <h3 style="margin-bottom:1rem;">Recent Orders</h3>
        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-orders-body">
                <tr><td colspan="5" class="loading">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>&copy; 2026 ShopEasy. All rights reserved.</p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
