<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="/" class="navbar-brand">ShopEasy</a>
    <ul class="navbar-nav" id="navbar-nav"></ul>
  </div>
</nav>

<main>
  <div class="container">
    <h2 style="margin-bottom:1.5rem;">Shopping Cart</h2>

    <p id="empty-cart" style="display:none; color:var(--text-muted);">
      Your cart is empty. <a href="/products.html">Continue shopping</a>
    </p>

    <div id="table-wrap">
      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="cart-body"></tbody>
          </table>
        </div>
      </div>
      <div class="cart-total" id="cart-total"></div>
      <div style="text-align:right; margin-top:1rem;">
        <a href="/checkout.html" class="btn btn-primary">Proceed to Checkout</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>&copy; 2026 ShopEasy. All rights reserved.</p>
  </div>
</footer>

<script src="/js/app.js"></script>
<script src="/js/cart.js"></script>
</body>
</html>
