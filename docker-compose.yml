version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8000:80"
    environment:
      - DB_HOST=database
      - DB_NAME=ecommerce
      - DB_USER=root
      - DB_PASS=root_password
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network

  database:
    image: mariadb:10.6
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_DATABASE=ecommerce
      - MARIADB_USER=ecommerce_user
      - MARIADB_PASSWORD=ecommerce_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
